# 构建 MIMITools 文档站点并部署到 GitHub Pages
name: Deploy MIMITools site to Pages

on:
  # 仅在 Actions 页面手动触发，或通过 deploy.ps1 脚本触发（不会随 push 自动部署）
  workflow_dispatch:

# 部署所需的 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，禁止中断进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate complete texture channel evidence
        run: |
          bun run test:channels --complete
          bun run test:channel-sources
          bun run test:channel-scope

      - name: Build VitePress site
        run: bun run docs:build

      - name: Validate built channel pages
        run: bun run test:channel-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
